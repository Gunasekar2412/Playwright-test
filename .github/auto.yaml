name: CI/CD

on:
	push:
		branches: [main, master]
	pull_request:
		branches: [main, master]
	workflow_dispatch:

permissions:
	contents: read

jobs:
	build-and-test:
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up Python
				uses: actions/setup-python@v5
				with:
					python-version: "3.x"
					cache: pip

			- name: Install Python dependencies
				shell: bash
				run: |
					python -m pip install --upgrade pip
					if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
					if [[ -f pyproject.toml ]]; then pip install .; fi

			- name: Install Node dependencies
				if: ${{ hashFiles('package-lock.json') != '' }}
				uses: actions/setup-node@v4
				with:
					node-version: 20
					cache: npm

			- name: Install Node packages
				if: ${{ hashFiles('package-lock.json') != '' }}
				run: npm ci

			- name: Run tests
				shell: bash
				run: |
					set -e
					if [[ -f package.json ]]; then npm test --if-present; fi
					if [[ -f pytest.ini || -f pyproject.toml || -d tests ]]; then python -m pytest; fi
					if [[ -f pom.xml ]]; then mvn --batch-mode test; fi

	deploy:
		name: Deploy
		needs: build-and-test
		if: github.ref == 'refs/heads/main' && github.event_name == 'push'
		runs-on: ubuntu-latest
		environment: production
		steps:
			- name: Checkout
				uses: actions/checkout@v4
			- name: Deploy application
				run: echo "Configure the production deployment command for this project."
